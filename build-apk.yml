name: Gerar APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Montar projeto Android a partir do index.html
        run: |
          mkdir -p www
          cp index.html www/index.html
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "app.conceito.horizonui",
            "appName": "Horizon Conceito",
            "webDir": "www",
            "backgroundColor": "#0f1418"
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Renomear APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Horizon-Conceito.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Horizon-Conceito-apk
          path: Horizon-Conceito.apk

      - name: Publicar na aba Releases (download direto no celular)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: APK mais recente
          files: Horizon-Conceito.apk
